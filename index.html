<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Atelier des Fractions - Spécial Cuisine d'Automne</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Polices Google -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Configuration Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'title': ['"Fredoka One"', 'cursive'],
                        'sans': ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        autumn: {
                            light: '#fef3c7',
                            wood: '#854d0e',
                            orange: '#f97316',
                            red: '#ef4444',
                            green: '#84cc16',
                            yellow: '#facc15',
                            crust: '#d97706'
                        }
                    },
                    animation: {
                        'bounce-slow': 'bounce 2s infinite',
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #fef3c7; color: #451a03; margin: 0; padding: 0; overflow-x: hidden; }
        .wood-panel { 
            background: #fffbeb; 
            border: 4px solid #b45309; 
            box-shadow: inset 0 0 20px rgba(180, 83, 9, 0.2), 0 10px 25px rgba(0,0,0,0.1); 
        }
        .item-enter { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        
        // --- DONNÉES DES NIVEAUX ---

        // 1. Équivalence de fractions
        const EQUIVALENCE_LEVELS = [
            { id: 1, baseFraction: {num: 1, den: 2}, eqFraction: {num: 2, den: 4}, name: 'Pizza', color: '#facc15', crust: '#ea580c' },
            { id: 2, baseFraction: {num: 1, den: 3}, eqFraction: {num: 2, den: 6}, name: 'Tarte aux pommes', color: '#fbbf24', crust: '#b45309' },
            { id: 3, baseFraction: {num: 3, den: 4}, eqFraction: {num: 6, den: 8}, name: 'Tarte aux petits fruits', color: '#be185d', crust: '#831843' }
        ].map(level => ({
            ...level,
            steps: [
                { title: "Introduction", text: `Observons ces deux ${level.name}s identiques. L'une est coupée en ${level.baseFraction.den}, l'autre en ${level.eqFraction.den}.` },
                { title: "La première fraction", text: `Je mange ${level.baseFraction.num}/${level.baseFraction.den} de la première ${level.name}.` },
                { title: "La deuxième fraction", text: `Dans la deuxième, je mange ${level.eqFraction.num}/${level.eqFraction.den}. Regarde bien !` },
                { title: "Magie de l'équivalence !", text: `C'est exactement la même quantité ! ${level.baseFraction.num}/${level.baseFraction.den} = ${level.eqFraction.num}/${level.eqFraction.den}. Ce sont des fractions équivalentes.` }
            ]
        }));

        // 2. Fractions d'un tout (Interactif)
        const WHOLE_LEVELS = [
            { id: 1, num: 3, den: 8, name: 'pizza', emoji: '🍕', color: '#facc15', crust: '#ea580c' },
            { id: 2, num: 2, den: 3, name: 'tarte à la citrouille', emoji: '🥧', color: '#ea580c', crust: '#9a3412' },
            { id: 3, num: 5, den: 6, name: 'gâteau au chocolat', emoji: '🎂', color: '#78350f', crust: '#451a03' },
            { id: 4, num: 1, den: 4, name: 'tourtière', emoji: '🥟', color: '#d97706', crust: '#78350f' }
        ];

        // 3. Problèmes (Recettes et Partage d'un tout)
        const PROBLEM_LEVELS = [
            {
                id: 1,
                title: "Soirée Pizza",
                text: "Nous avons commandé une grande pizza coupée en 8 pointes. Papa mange 1/4 de la pizza, Maman en mange la moitié (1/2) et je mange le reste. Distribue les pointes !",
                total: 8, // Dénominateur commun (le tout)
                name: 'pizza',
                color: '#facc15', crust: '#ea580c',
                actors: [
                    { id: 1, name: "Papa (1/4)", color: "#3b82f6", target: 2, den: 4 }, // 1/4 de 8 = 2
                    { id: 2, name: "Maman (1/2)", color: "#ec4899", target: 4, den: 2 }, // 1/2 de 8 = 4
                    { id: 3, name: "Moi (Le reste)", color: "#22c55e", target: 2, den: 1 } // Reste = 2
                ],
                explanation: [
                    "Papa : 1/4 de 8 pointes. 8 ÷ 4 = 2 pointes.",
                    "Maman : 1/2 de 8 pointes (la moitié). 8 ÷ 2 = 4 pointes.",
                    "Moi : Le reste. 8 - 2 - 4 = 2 pointes."
                ]
            },
            {
                id: 2,
                title: "La tarte aux pommes",
                text: "Mamy a cuisiné une belle tarte aux pommes coupée en 6 parts. Léo mange 1/3 de la tarte, Mia en mange 1/6, et Mamy garde le reste pour demain.",
                total: 6,
                name: 'tarte',
                color: '#fbbf24', crust: '#b45309',
                actors: [
                    { id: 1, name: "Léo (1/3)", color: "#ef4444", target: 2, den: 3 }, // 1/3 de 6 = 2
                    { id: 2, name: "Mia (1/6)", color: "#a855f7", target: 1, den: 6 }, // 1/6 de 6 = 1
                    { id: 3, name: "Mamy (Le reste)", color: "#14b8a6", target: 3, den: 1 } // Reste = 3
                ],
                explanation: [
                    "Léo : 1/3 de 6 parts. 6 ÷ 3 = 2 parts.",
                    "Mia : 1/6 de 6 parts. 6 ÷ 6 = 1 part.",
                    "Mamy : Le reste. 6 - 2 - 1 = 3 parts."
                ]
            }
        ];

        // 4. La Baguette Magique (Amplification de fraction pas-à-pas)
        const MAGIC_WAND_LEVELS = [
            { id: 1, base: {num: 1, den: 2}, multiplier: 2, name: 'pizza', color: '#facc15', crust: '#ea580c' },
            { id: 2, base: {num: 1, den: 3}, multiplier: 3, name: 'tarte aux pommes', color: '#fbbf24', crust: '#b45309' },
            { id: 3, base: {num: 3, den: 4}, multiplier: 2, name: 'gâteau', color: '#78350f', crust: '#451a03' }
        ];

        // --- COMPOSANT SVG : UNE POINTE DE TARTE ---
        const PieSlice = ({ startAngle, endAngle, radius, fill, stroke, isSelected, onClick, overrideColor }) => {
            const startRad = (startAngle - 90) * Math.PI / 180;
            const endRad = (endAngle - 90) * Math.PI / 180;

            const cx = 100;
            const cy = 100;

            const x1 = cx + radius * Math.cos(startRad);
            const y1 = cy + radius * Math.sin(startRad);
            const x2 = cx + radius * Math.cos(endRad);
            const y2 = cy + radius * Math.sin(endRad);

            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
            
            // Cas spécial pour 100% (cercle complet) pour éviter le bug SVG
            if (endAngle - startAngle === 360) {
                return (
                    <circle cx={cx} cy={cy} r={radius} fill={overrideColor || fill} stroke={stroke} strokeWidth="4" 
                        onClick={onClick}
                        className={`transition-all duration-300 cursor-pointer ${isSelected ? 'opacity-100' : 'opacity-40 hover:opacity-70'}`}
                    />
                );
            }

            const d = [
                "M", cx, cy,
                "L", x1, y1,
                "A", radius, radius, 0, largeArcFlag, 1, x2, y2,
                "Z"
            ].join(" ");

            return (
                <path
                    d={d}
                    fill={overrideColor || fill}
                    stroke={stroke}
                    strokeWidth="3"
                    onClick={onClick}
                    className={`transition-all duration-300 cursor-pointer origin-center
                        ${isSelected ? 'opacity-100 drop-shadow-md scale-[1.02]' : 'opacity-30 hover:opacity-60'}
                    `}
                />
            );
        };

        // --- COMPOSANT SVG : LA TARTE COMPLÈTE ---
        const PieChart = ({ totalSlices, selectedIndices, color, crust, onSliceClick, sliceColors = {}, sizeClass = "w-48 h-48 md:w-64 md:h-64" }) => {
            const anglePerSlice = 360 / totalSlices;

            return (
                <svg viewBox="0 0 200 200" className={`${sizeClass} drop-shadow-xl overflow-visible`}>
                    {/* Fond (Assiette) */}
                    <circle cx="100" cy="100" r="95" fill="#f3f4f6" stroke="#d1d5db" strokeWidth="2" />
                    
                    {Array.from({ length: totalSlices }).map((_, idx) => {
                        const startAngle = idx * anglePerSlice;
                        const endAngle = (idx + 1) * anglePerSlice;
                        const isSelected = selectedIndices.has(idx);
                        
                        return (
                            <PieSlice
                                key={idx}
                                startAngle={startAngle}
                                endAngle={endAngle}
                                radius={90}
                                fill={color}
                                stroke={crust}
                                isSelected={isSelected}
                                overrideColor={sliceColors[idx]}
                                onClick={() => onSliceClick && onSliceClick(idx)}
                            />
                        );
                    })}
                </svg>
            );
        };


        // --- MODE 1 : SIMULATION D'ÉQUIVALENCE ---
        const EquivalenceSimulator = ({ level, onNextLevel }) => {
            const [currentStep, setCurrentStep] = React.useState(0);

            React.useEffect(() => setCurrentStep(0), [level]);

            const nextStep = () => { if (currentStep < level.steps.length - 1) setCurrentStep(prev => prev + 1); };
            const prevStep = () => { if (currentStep > 0) setCurrentStep(prev => prev - 1); };

            const stepData = level.steps[currentStep];
            const isFinished = currentStep === level.steps.length - 1;

            // Déterminer quelles pointes sont coloriées selon l'étape
            const selectedA = new Set();
            if (currentStep >= 1) {
                for(let i=0; i<level.baseFraction.num; i++) selectedA.add(i);
            }

            const selectedB = new Set();
            if (currentStep >= 2) {
                for(let i=0; i<level.eqFraction.num; i++) selectedB.add(i);
            }

            return (
                <div className="flex flex-col items-center w-full max-w-5xl mx-auto space-y-6">
                    <div className="text-center w-full space-y-2">
                        <h2 className="text-3xl md:text-5xl font-title text-autumn-wood tracking-wider">
                            La Vitrine du Pâtissier
                        </h2>
                        
                        <div className="bg-white p-6 rounded-xl border-l-8 border-autumn-orange shadow-lg mt-4 min-h-[120px] flex flex-col justify-center item-enter" key={currentStep}>
                            <h3 className="text-2xl font-bold text-autumn-orange mb-2">{stepData.title}</h3>
                            <p className="text-xl md:text-2xl text-gray-800">{stepData.text}</p>
                        </div>
                    </div>

                    {/* Zone Visuelle */}
                    <div className="wood-panel p-8 rounded-3xl w-full flex flex-col md:flex-row items-center justify-around min-h-[350px] relative overflow-hidden">
                        
                        {/* Tarte A */}
                        <div className={`flex flex-col items-center gap-4 transition-all duration-700 ${currentStep === 3 ? 'transform translate-x-[50%] md:translate-x-[150%] opacity-0' : ''}`}>
                            <h4 className="text-2xl font-bold bg-white px-4 py-1 rounded-full shadow border border-gray-200">
                                {currentStep >= 1 ? `${level.baseFraction.num}/${level.baseFraction.den}` : `Coupé en ${level.baseFraction.den}`}
                            </h4>
                            <PieChart totalSlices={level.baseFraction.den} selectedIndices={selectedA} color={level.color} crust={level.crust} />
                        </div>

                        {/* Signe Égal (apparaît à la fin) */}
                        {currentStep === 3 && (
                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-8xl font-title text-autumn-wood animate-bounce z-10 bg-white/80 rounded-full px-4">
                                =
                            </div>
                        )}

                        {/* Tarte B */}
                        <div className={`flex flex-col items-center gap-4 transition-all duration-700 ${currentStep === 3 ? 'transform -translate-x-[50%] md:-translate-x-[150%]' : ''}`}>
                            <h4 className="text-2xl font-bold bg-white px-4 py-1 rounded-full shadow border border-gray-200">
                                {currentStep >= 2 ? `${level.eqFraction.num}/${level.eqFraction.den}` : `Coupé en ${level.eqFraction.den}`}
                            </h4>
                            <PieChart totalSlices={level.eqFraction.den} selectedIndices={selectedB} color={level.color} crust={level.crust} />
                        </div>
                    </div>

                    {/* Boutons */}
                    <div className="flex flex-wrap justify-center gap-4 w-full">
                        <button onClick={prevStep} disabled={currentStep === 0} className={`font-bold py-3 px-6 rounded-full shadow border-b-4 transition-all text-lg ${currentStep === 0 ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-white hover:bg-gray-100 text-autumn-wood border-gray-300 active:border-b-0 active:translate-y-1'}`}>
                            ⬅️ Précédent
                        </button>
                        
                        {!isFinished ? (
                            <button onClick={nextStep} className="bg-autumn-green hover:bg-green-400 text-white font-bold py-3 px-8 rounded-full shadow-lg border-b-4 border-green-700 active:border-b-0 active:translate-y-1 transition-all animate-pulse-fast text-lg">
                                Étape suivante ➡️
                            </button>
                        ) : (
                            <button onClick={onNextLevel} className="bg-autumn-orange hover:bg-orange-400 text-white font-bold py-3 px-8 rounded-full shadow-lg border-b-4 border-orange-700 active:border-b-0 active:translate-y-1 transition-all text-lg">
                                Niveau suivant ➡️
                            </button>
                        )}
                    </div>
                </div>
            );
        };


        // --- MODE 2 : FRACTION D'UN TOUT (INTERACTIF) ---
        const WholeSimulator = ({ level, onNextLevel }) => {
            const [selected, setSelected] = React.useState(new Set());
            const [isSuccess, setIsSuccess] = React.useState(false);

            React.useEffect(() => {
                setSelected(new Set());
                setIsSuccess(false);
            }, [level]);

            React.useEffect(() => {
                setIsSuccess(selected.size === level.num);
            }, [selected, level.num]);

            const toggleSelection = (index) => {
                const newSelected = new Set(selected);
                if (newSelected.has(index)) {
                    newSelected.delete(index);
                } else {
                    if (newSelected.size < level.den) newSelected.add(index);
                }
                setSelected(newSelected);
            };

            const handleShowAnswer = () => {
                const answerSet = new Set();
                for (let i = 0; i < level.num; i++) answerSet.add(i);
                setSelected(answerSet);
            };

            // Fonction mathématique pour calculer le PGCD
            const getGCD = (a, b) => b === 0 ? a : getGCD(b, a % b);
            
            const currentNum = selected.size;
            const currentDen = level.den;
            const isWhole = currentNum > 0 && currentNum === currentDen;
            
            // Génération d'au moins 2 équivalences visuelles permanentes pour l'analyse
            let equivalents = [];

            if (currentNum > 0) {
                const divisor = getGCD(currentNum, currentDen);
                const simpNum = currentNum / divisor;
                const simpDen = currentDen / divisor;

                // 1. Ajouter d'abord la forme simplifiée / réduite si différente
                if (simpDen !== currentDen && simpDen <= 24) {
                    equivalents.push({ num: simpNum, den: simpDen });
                }

                // 2. Générer des équivalences (multiples de la forme irréductible)
                let multiplier = 2;
                while (equivalents.length < 2 && multiplier <= 10) {
                    let eqDen = simpDen * multiplier;
                    let eqNum = simpNum * multiplier;
                    
                    // On accepte de monter jusqu'à 32 parts pour garantir 2 équivalences (ex: 3/8 -> 6/16 et 9/24)
                    if (eqDen !== currentDen && eqDen <= 32 && !equivalents.some(e => e.den === eqDen)) {
                        equivalents.push({ num: eqNum, den: eqDen });
                    }
                    multiplier++;
                }

                // 3. Sécurité absolue : Si jamais on a toujours moins de 2 (cas extrême), on force l'ajout
                let fallbackMult = 2;
                while (equivalents.length < 2 && fallbackMult <= 8) {
                    let candidateDen = currentDen * fallbackMult;
                    let candidateNum = currentNum * fallbackMult;
                    if (candidateDen !== currentDen && !equivalents.some(e => e.den === candidateDen)) {
                        equivalents.push({ num: candidateNum, den: candidateDen });
                    }
                    fallbackMult++;
                }
            }

            return (
                <div className="flex flex-col items-center w-full max-w-5xl mx-auto space-y-6">
                    <div className="text-center space-y-2">
                        <h2 className="text-3xl md:text-5xl font-title text-autumn-wood tracking-wider">
                            L'Atelier des Tartes
                        </h2>
                        <p className="text-xl md:text-2xl">
                            Prépare <strong className="text-autumn-orange text-3xl font-bold bg-white px-2 rounded border">{level.num}/{level.den}</strong> de cette {level.name}.
                        </p>
                        <p className="text-gray-600 italic">
                            Le tout est divisé en {level.den} parts égales. Touche les pointes pour les sélectionner.
                        </p>
                    </div>

                    {/* Zone interactive */}
                    <div className="wood-panel p-6 rounded-3xl w-full max-w-5xl relative min-h-[450px] flex flex-col items-center justify-center">
                        <div className="flex flex-col lg:flex-row items-center gap-8 w-full justify-around">
                            {/* Tarte Principale */}
                            <div className="flex flex-col items-center">
                                <h3 className="text-xl font-bold text-autumn-wood mb-2">Tarte principale</h3>
                                <PieChart 
                                    totalSlices={level.den} 
                                    selectedIndices={selected} 
                                    color={level.color} 
                                    crust={level.crust} 
                                    onSliceClick={toggleSelection}
                                />
                                <div className="mt-4 text-xl font-bold bg-white px-6 py-2 rounded-2xl shadow border text-center">
                                    Fraction actuelle : <span className={selected.size === level.num ? "text-autumn-green" : "text-autumn-orange text-2xl"}>{currentNum}</span> / {currentDen}
                                    {isWhole && <div className="text-blue-600 bg-blue-50 px-4 py-1 rounded-full border border-blue-200 mt-2 text-sm item-enter">C'est 1 entier !</div>}
                                </div>
                            </div>

                            {/* Zone des Équivalences Visuelles (Toujours au moins 2 représentations quand disponible) */}
                            {equivalents.length > 0 && (
                                <div className="flex flex-col items-center bg-blue-50/80 p-6 rounded-2xl border-2 border-dashed border-blue-300 item-enter w-full lg:w-auto">
                                    <h4 className="text-blue-900 font-bold mb-4 bg-white px-4 py-2 rounded-full shadow-sm text-base flex items-center gap-2">
                                        <span>✨ Représentations équivalentes ({equivalents.length}) ✨</span>
                                    </h4>
                                    <div className="flex flex-wrap gap-6 justify-center items-center">
                                        {equivalents.slice(0, 3).map((eq, idx) => {
                                            const eqSelected = new Set();
                                            for(let i=0; i<eq.num; i++) eqSelected.add(i);
                                            return (
                                                <div key={idx} className="flex flex-col items-center gap-2 item-enter bg-white p-3 rounded-xl border border-blue-200 shadow-sm" style={{animationDelay: `${idx * 0.15}s`}}>
                                                    <div className="w-24 h-24 md:w-28 md:h-28 pointer-events-none">
                                                        <PieChart 
                                                            totalSlices={eq.den} 
                                                            selectedIndices={eqSelected} 
                                                            color={level.color} 
                                                            crust={level.crust}
                                                            sizeClass="w-full h-full"
                                                        />
                                                    </div>
                                                    <div className="text-xl font-bold text-blue-700 bg-blue-100 px-4 py-1 rounded-full shadow-sm border border-blue-300">
                                                        {eq.num}/{eq.den}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <p className="text-xs text-blue-600 italic mt-3 text-center">Même surface de tarte coloriée avec un nombre de parts différent.</p>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="flex flex-col items-center gap-4 w-full">
                        {isSuccess ? (
                            <div className="flex flex-col items-center justify-center bg-white p-6 rounded-3xl border-4 border-autumn-green shadow-xl item-enter w-full max-w-2xl">
                                <h3 className="text-4xl font-title text-autumn-green animate-bounce mb-2">Délicieux !</h3>
                                <p className="text-xl text-autumn-wood mb-2">Tu as bien préparé {level.num}/{level.den} de la recette.</p>
                                
                                <button onClick={onNextLevel} className="mt-4 bg-autumn-orange hover:bg-orange-400 text-white font-bold py-3 px-8 rounded-full shadow-lg border-b-4 border-orange-700 active:translate-y-1 transition-all text-xl">
                                    Recette suivante ➡️
                                </button>
                            </div>
                        ) : (
                            <button onClick={handleShowAnswer} className="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded-full border-b-4 border-gray-400 active:border-b-0 active:translate-y-1 transition-all">
                                Voir la réponse 💡
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // --- MODE 3 : PROBLÈMES DE PARTAGE ---
        const ProblemSimulator = ({ level, onNextLevel }) => {
            const [activeActorId, setActiveActorId] = React.useState(null);
            // Tableau des assignations (null = aucune, sinon = id de l'acteur)
            const [assignments, setAssignments] = React.useState(Array(level.total).fill(null));
            const [showExp, setShowExp] = React.useState(false);
            const [isSuccess, setIsSuccess] = React.useState(false);

            React.useEffect(() => {
                setAssignments(Array(level.total).fill(null));
                setActiveActorId(null);
                setShowExp(false);
                setIsSuccess(false);
            }, [level]);

            const currentCounts = level.actors.reduce((acc, actor) => {
                acc[actor.id] = assignments.filter(a => a === actor.id).length;
                return acc;
            }, {});

            React.useEffect(() => {
                let win = true;
                level.actors.forEach(actor => {
                    if (currentCounts[actor.id] !== actor.target) win = false;
                });
                if (assignments.includes(null)) win = false;
                setIsSuccess(win);
            }, [assignments, currentCounts, level]);

            const handleAssign = (index) => {
                if (isSuccess && !showExp) return;
                if (!activeActorId) return;

                const newAssignments = [...assignments];
                if (newAssignments[index] === activeActorId) {
                    newAssignments[index] = null; // Toggle off
                } else if (newAssignments[index] === null) {
                    newAssignments[index] = activeActorId; // Toggle on
                }
                setAssignments(newAssignments);
            };

            const handleShowAnswer = () => {
                let newAssignments = [];
                level.actors.forEach(actor => {
                    for(let i=0; i < actor.target; i++) newAssignments.push(actor.id);
                });
                setAssignments(newAssignments);
            };

            const activeActor = level.actors.find(a => a.id === activeActorId);

            // Créer le Set des indices sélectionnés (tous ceux qui ne sont pas null)
            const selectedIndices = new Set(assignments.map((val, idx) => val !== null ? idx : null).filter(val => val !== null));
            
            // Préparer les couleurs spécifiques pour chaque pointe
            const sliceColors = {};
            assignments.forEach((actorId, idx) => {
                if (actorId !== null) {
                    const actor = level.actors.find(a => a.id === actorId);
                    sliceColors[idx] = actor.color;
                }
            });

            return (
                <div className="flex flex-col items-center w-full max-w-5xl mx-auto space-y-6">
                    <div className="text-center space-y-2">
                        <h2 className="text-3xl md:text-5xl font-title text-autumn-wood tracking-wider">
                            {level.title}
                        </h2>
                    </div>

                    <div className="bg-white p-6 rounded-2xl w-full text-lg md:text-xl font-medium leading-relaxed border-l-8 border-l-autumn-orange shadow-md">
                        <p>{level.text}</p>
                    </div>

                    <div className="flex flex-col gap-8 w-full">
                        
                        {/* Zone Graphique */}
                        <div className="wood-panel p-6 rounded-3xl w-full relative min-h-[400px] flex flex-col items-center justify-start">
                            {isSuccess && !showExp && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center bg-white/95 rounded-3xl z-20 backdrop-blur-sm border-4 border-autumn-green item-enter">
                                    <h3 className="text-5xl font-title text-autumn-green animate-bounce mb-4">Parfait !</h3>
                                    <p className="text-xl text-autumn-wood text-center px-4 mb-6">Le partage de la recette est exact.</p>
                                    <div className="flex gap-4">
                                        <button onClick={() => setShowExp(true)} className="bg-blue-500 hover:bg-blue-400 text-white font-bold py-3 px-6 rounded-full shadow-lg">
                                            Voir l'explication
                                        </button>
                                        <button onClick={onNextLevel} className="bg-autumn-orange hover:bg-orange-400 text-white font-bold py-3 px-6 rounded-full shadow-lg">
                                            Problème suivant ➡️
                                        </button>
                                    </div>
                                </div>
                            )}

                            <div className="text-center mb-6">
                                {!activeActor ? (
                                    <span className="text-xl italic text-gray-500 font-semibold animate-pulse">
                                        Étape 1 : Choisis une personne en bas.
                                    </span>
                                ) : (
                                    <span className="text-xl font-bold" style={{color: activeActor.color}}>
                                        Étape 2 : Clique sur la {level.name} pour colorier la part de {activeActor.name.split(' ')[0]}.
                                    </span>
                                )}
                            </div>

                            {/* La tarte à partager */}
                            <PieChart 
                                totalSlices={level.total} 
                                selectedIndices={selectedIndices} 
                                color={level.color} 
                                crust={level.crust} 
                                onSliceClick={handleAssign}
                                sliceColors={sliceColors}
                            />
                        </div>

                        {/* Personnages */}
                        <div className="flex flex-wrap justify-center gap-4 w-full">
                            {level.actors.map(actor => {
                                const count = currentCounts[actor.id];
                                const isDone = count === actor.target;
                                const isOver = count > actor.target;
                                
                                return (
                                    <button 
                                        key={actor.id}
                                        onClick={() => setActiveActorId(actor.id)}
                                        className={`relative p-4 rounded-xl flex flex-col md:flex-row items-center gap-4 transition-all border-4 min-w-[220px] shadow-sm bg-white
                                            ${activeActorId === actor.id ? 'scale-110 shadow-lg z-10' : 'opacity-80 hover:opacity-100 hover:scale-105'}`}
                                        style={{ borderColor: activeActorId === actor.id ? actor.color : 'transparent' }}
                                    >
                                        <div className="w-6 h-6 rounded-full shadow-inner" style={{ backgroundColor: actor.color }}></div>
                                        <span className="font-bold text-gray-800 text-xl flex-grow text-center md:text-left">{actor.name}</span>
                                        <div className="bg-gray-100 rounded-lg px-4 py-2 text-gray-700 font-mono font-bold flex gap-2 items-center text-xl border">
                                            <span>{count} / {actor.target}</span>
                                            {isDone && <span className="text-green-500 font-sans font-black text-2xl">✓</span>}
                                            {isOver && <span className="text-red-500 text-sm absolute -top-3 -right-3 bg-white rounded-full px-2 py-1 border border-red-500 animate-pulse">Trop!</span>}
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    <div className="flex flex-wrap justify-center gap-4 w-full pt-4">
                        <button onClick={handleShowAnswer} className="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded-full border-b-4 border-gray-400 active:border-b-0 active:translate-y-1 transition-all">
                            Voir la réponse 💡
                        </button>
                        <button onClick={() => setShowExp(!showExp)} className="bg-blue-500 hover:bg-blue-400 text-white font-bold py-2 px-6 rounded-full border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 transition-all">
                            {showExp ? "Cacher les explications" : "Voir les explications 📖"}
                        </button>
                    </div>

                    {showExp && (
                        <div className="bg-white p-6 rounded-2xl w-full border-l-8 border-l-blue-500 shadow-md item-enter mt-4">
                            <h3 className="text-2xl font-bold text-blue-600 mb-4">Le livre de recettes (Explications)</h3>
                            <ul className="space-y-4">
                                {level.explanation.map((line, idx) => (
                                    <li key={idx} className="flex gap-4 items-start">
                                        <div className="w-6 h-6 rounded-full mt-1 flex-shrink-0" style={{backgroundColor: level.actors[idx].color}}></div>
                                        <p className="text-lg text-gray-800">{line}</p>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}
                </div>
            );
        };

        // --- MODE 4 : LA BAGUETTE MAGIQUE (AMPLIFICATION PAS-À-PAS) ---
        const MagicWandSimulator = ({ level, onNextLevel }) => {
            const [step, setStep] = React.useState(0);

            React.useEffect(() => {
                setStep(0);
            }, [level]);

            const nextStep = () => { if (step < 2) setStep(step + 1); };

            const selectedBase = new Set();
            for(let i=0; i<level.base.num; i++) selectedBase.add(i);

            const resultNum = level.base.num * level.multiplier;
            const resultDen = level.base.den * level.multiplier;
            
            const selectedResult = new Set();
            for(let i=0; i<resultNum; i++) selectedResult.add(i);

            return (
                <div className="flex flex-col items-center w-full max-w-5xl mx-auto space-y-6">
                    <div className="text-center w-full space-y-2">
                        <h2 className="text-3xl md:text-5xl font-title text-autumn-wood tracking-wider">
                            La Baguette Magique 🪄
                        </h2>
                        
                        <div className="bg-white p-6 rounded-xl border-l-8 border-purple-500 shadow-lg mt-4 min-h-[120px] flex flex-col justify-center item-enter" key={step}>
                            {step === 0 && (
                                <>
                                    <h3 className="text-2xl font-bold text-purple-600 mb-2">Étape 1 : Notre point de départ</h3>
                                    <p className="text-xl md:text-2xl text-gray-800">Voici {level.base.num}/{level.base.den} de {level.name}. On va utiliser la magie pour faire plus de parts !</p>
                                </>
                            )}
                            {step === 1 && (
                                <>
                                    <h3 className="text-2xl font-bold text-purple-600 mb-2">Étape 2 : Le sortilège de multiplication</h3>
                                    <p className="text-xl md:text-2xl text-gray-800">Si on utilise la magie pour séparer CHAQUE part en {level.multiplier}, on doit multiplier en haut <strong>ET</strong> en bas par {level.multiplier} !</p>
                                </>
                            )}
                            {step === 2 && (
                                <>
                                    <h3 className="text-2xl font-bold text-purple-600 mb-2">Étape 3 : Tadam ! Une nouvelle fraction !</h3>
                                    <p className="text-xl md:text-2xl text-gray-800">La quantité à manger reste <strong>exactement la même</strong>, mais la fraction s'écrit maintenant {resultNum}/{resultDen} !</p>
                                </>
                            )}
                        </div>
                    </div>

                    <div className="wood-panel p-8 rounded-3xl w-full flex flex-col lg:flex-row items-center justify-around min-h-[350px] relative overflow-hidden gap-8">
                        
                        {/* Fraction de base */}
                        <div className="flex flex-col items-center gap-4">
                            <PieChart totalSlices={level.base.den} selectedIndices={selectedBase} color={level.color} crust={level.crust} />
                            <div className="text-3xl font-bold text-autumn-wood flex flex-col items-center bg-white px-4 py-2 rounded-xl shadow border">
                                <span>{level.base.num}</span>
                                <hr className="w-8 border-t-4 border-autumn-wood my-1"/>
                                <span>{level.base.den}</span>
                            </div>
                        </div>

                        {/* Le calcul magique (apparaît à l'étape 1) */}
                        {step >= 1 && (
                            <div className="flex items-center gap-2 md:gap-4 item-enter text-2xl md:text-4xl font-black text-purple-600 bg-purple-50 p-4 md:p-6 rounded-3xl border-4 border-purple-300 shadow-inner">
                                {/* Fraction de base */}
                                <div className="text-2xl md:text-4xl font-bold text-gray-700 flex flex-col items-center bg-white px-4 py-2 rounded-xl shadow-sm border-2 border-gray-300">
                                    <span>{level.base.num}</span>
                                    <hr className="w-8 md:w-10 border-t-4 border-gray-700 my-1"/>
                                    <span>{level.base.den}</span>
                                </div>
                                
                                {/* Multiplicateurs */}
                                <div className="flex flex-col items-center justify-between gap-6 mx-2 text-lg md:text-3xl">
                                    <span className="animate-pulse">× {level.multiplier} ➡️</span>
                                    <span className="animate-pulse">× {level.multiplier} ➡️</span>
                                </div>
                                
                                {/* Fraction Résultat */}
                                <div className="text-3xl md:text-5xl font-bold text-purple-700 flex flex-col items-center bg-white px-6 py-2 rounded-xl shadow-md border-2 border-purple-400">
                                    <span>{resultNum}</span>
                                    <hr className="w-12 border-t-4 border-purple-700 my-1"/>
                                    <span>{resultDen}</span>
                                </div>
                            </div>
                        )}

                        {/* Fraction Résultat (apparaît à l'étape 2) */}
                        {step >= 2 && (
                            <div className="flex flex-col items-center gap-4 item-enter">
                                <PieChart totalSlices={resultDen} selectedIndices={selectedResult} color={level.color} crust={level.crust} />
                                <div className="text-3xl font-bold text-autumn-wood flex flex-col items-center bg-white px-4 py-2 rounded-xl shadow border">
                                    <span>{resultNum}</span>
                                    <hr className="w-8 border-t-4 border-autumn-wood my-1"/>
                                    <span>{resultDen}</span>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* Navigation du pas-à-pas */}
                    <div className="flex justify-center w-full">
                        {step === 0 && (
                            <button onClick={nextStep} className="bg-purple-500 hover:bg-purple-400 text-white font-bold py-3 px-8 rounded-full shadow-lg border-b-4 border-purple-700 active:border-b-0 active:translate-y-1 transition-all text-xl">
                                Utiliser la magie (×{level.multiplier}) 🪄
                            </button>
                        )}
                        {step === 1 && (
                            <button onClick={nextStep} className="bg-autumn-green hover:bg-green-400 text-white font-bold py-3 px-8 rounded-full shadow-lg border-b-4 border-green-700 active:border-b-0 active:translate-y-1 transition-all text-xl animate-pulse-fast">
                                Voir le résultat ✨
                            </button>
                        )}
                        {step === 2 && (
                            <button onClick={onNextLevel} className="bg-autumn-orange hover:bg-orange-400 text-white font-bold py-3 px-8 rounded-full shadow-lg border-b-4 border-orange-700 active:border-b-0 active:translate-y-1 transition-all text-xl">
                                Sortilège suivant ➡️
                            </button>
                        )}
                    </div>
                </div>
            );
        };


        // --- APPLICATION PRINCIPALE ---
        const App = () => {
            const [mode, setMode] = React.useState('menu');
            const [levelIndex, setLevelIndex] = React.useState(0);

            const startMode = (newMode) => {
                setLevelIndex(0);
                setMode(newMode);
            };

            const nextLevel = (collection) => {
                if (levelIndex < collection.length - 1) setLevelIndex(prev => prev + 1);
                else setMode('menu');
            };

            return (
                <div className="min-h-screen relative font-sans pb-12">
                    {/* Header */}
                    <header className="p-4 bg-white border-b-4 border-autumn-wood shadow-md relative flex items-center justify-center min-h-[100px]">
                        {mode !== 'menu' && (
                            <button 
                                onClick={() => setMode('menu')}
                                className="absolute left-4 top-1/2 transform -translate-y-1/2 bg-gray-100 hover:bg-gray-200 border border-gray-300 text-autumn-wood font-bold py-2 px-4 rounded-xl shadow transition-all z-50 flex items-center gap-2 hover:scale-105 active:scale-95"
                            >
                                <span className="text-xl">⬅️</span>
                                <span className="hidden md:inline">Retour au menu</span>
                            </button>
                        )}
                        <h1 className="text-4xl md:text-5xl text-autumn-wood font-title tracking-wide z-10 flex items-center gap-4">
                            👨‍🍳 L'Atelier des Fractions 🥧
                        </h1>
                    </header>

                    <main className="container mx-auto p-4 py-8 flex justify-center">
                        {mode === 'menu' && (
                            <div className="flex flex-col items-center space-y-8 mt-10 item-enter w-full">
                                <h2 className="text-3xl text-autumn-wood font-bold text-center">Que veux-tu cuisiner aujourd'hui ?</h2>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-7xl w-full px-4">
                                    
                                    <div className="bg-white p-6 rounded-3xl text-center hover:scale-105 transition-transform duration-300 border-t-8 border-autumn-orange shadow-xl cursor-pointer group flex flex-col justify-between" onClick={() => startMode('equivalence')}>
                                        <div>
                                            <div className="text-5xl mb-4 group-hover:animate-bounce-slow">🔍</div>
                                            <h3 className="text-xl font-bold text-autumn-orange mb-2 font-title">La Vitrine</h3>
                                            <p className="text-gray-600 text-sm mb-4">Observe les tartes pour comprendre que 1/2 c'est la même chose que 2/4 !</p>
                                        </div>
                                        <button className="bg-autumn-orange hover:bg-orange-500 text-white font-bold py-2 px-6 rounded-full w-full shadow">Observer</button>
                                    </div>

                                    <div className="bg-white p-6 rounded-3xl text-center hover:scale-105 transition-transform duration-300 border-t-8 border-autumn-green shadow-xl cursor-pointer group flex flex-col justify-between" onClick={() => startMode('whole')}>
                                        <div>
                                            <div className="text-5xl mb-4 group-hover:animate-bounce-slow">🍕</div>
                                            <h3 className="text-xl font-bold text-autumn-green mb-2 font-title">L'Atelier</h3>
                                            <p className="text-gray-600 text-sm mb-4">Sélectionne les pointes de pizzas pour représenter la bonne fraction.</p>
                                        </div>
                                        <button className="bg-autumn-green hover:bg-green-500 text-white font-bold py-2 px-6 rounded-full w-full shadow">Cuisiner</button>
                                    </div>

                                    <div className="bg-white p-6 rounded-3xl text-center hover:scale-105 transition-transform duration-300 border-t-8 border-purple-500 shadow-xl cursor-pointer group flex flex-col justify-between" onClick={() => startMode('magic')}>
                                        <div>
                                            <div className="text-5xl mb-4 group-hover:animate-bounce-slow">🪄</div>
                                            <h3 className="text-xl font-bold text-purple-500 mb-2 font-title">La Baguette Magique</h3>
                                            <p className="text-gray-600 text-sm mb-4">Découvre le secret pour créer des fractions équivalentes en multipliant !</p>
                                        </div>
                                        <button className="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-6 rounded-full w-full shadow">Apprendre</button>
                                    </div>

                                    <div className="bg-white p-6 rounded-3xl text-center hover:scale-105 transition-transform duration-300 border-t-8 border-blue-500 shadow-xl cursor-pointer group flex flex-col justify-between" onClick={() => startMode('problem')}>
                                        <div>
                                            <div className="text-5xl mb-4 group-hover:animate-bounce-slow">📖</div>
                                            <h3 className="text-xl font-bold text-blue-500 mb-2 font-title">Les Recettes</h3>
                                            <p className="text-gray-600 text-sm mb-4">Lis l'histoire et partage équitablement la nourriture entre les invités.</p>
                                        </div>
                                        <button className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-full w-full shadow">Résoudre</button>
                                    </div>

                                </div>
                            </div>
                        )}

                        {mode === 'equivalence' && <EquivalenceSimulator level={EQUIVALENCE_LEVELS[levelIndex]} onNextLevel={() => nextLevel(EQUIVALENCE_LEVELS)} />}
                        {mode === 'whole' && <WholeSimulator level={WHOLE_LEVELS[levelIndex]} onNextLevel={() => nextLevel(WHOLE_LEVELS)} />}
                        {mode === 'magic' && <MagicWandSimulator level={MAGIC_WAND_LEVELS[levelIndex]} onNextLevel={() => nextLevel(MAGIC_WAND_LEVELS)} />}
                        {mode === 'problem' && <ProblemSimulator level={PROBLEM_LEVELS[levelIndex]} onNextLevel={() => nextLevel(PROBLEM_LEVELS)} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
